<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveForge</title>
    <link href="https://fonts.googleapis.com/css?family=Michroma" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main">
        <input type="checkbox" id="about-control" style="display: none;">

        <div class="modal-overlay">
            <div class="modal-content">
                <label for="about-control" class="close-button">&times;</label>
                <h3>About:</h3>
                <p style="line-height: 1.6; color: rgba(180, 255, 184, 0.9);">
                    WAVEFORGE is a music digital sanctuary. 
                    From raw oscillators to complex atmospheric landscapes, every frequency 
                    is forged to resonate. This is where synthesis meets obsession.
                </p>
            </div>
        </div>
        
        <header class="header">
            <h1>WAVEFORGE</h1>
            <div class="header-button">
                <label for="about-control" class="btn-about">ABOUT</label>
                <button>CONTACT</button>
            </div>
        </header>

        <aside class="side side-left"></aside>
        
        <main class="main-content">
        <section class="hero">
            <h2>Synthesizing your next obsession</h2>
        </section>

        <section class="artist-header">
            <div class="artist-banner">
                <span class="banner-text">*ARTIST BANNER*</span>
            </div>
            <div class="artist-photo-container">
                <div class="photo-circle">
                    <!-- <img src="sua-foto.jpg" alt="Foto do Artista"> -->
                </div>
            </div>
        </section>

        <div class="tracks-grid">
            <div class="track-card">Track 01</div>
            <div class="track-card">Track 02</div>
            <div class="track-card">Track 03</div>
            <div class="track-card">Track 04</div>
            <div class="track-card">Track 05</div>
            <div class="track-card">Track 06</div>
        </div>
        </main>
            
        <aside class="side side-right"></aside>
    </div>
</body>
</html>
